# Mantiene la hoja caliente de fondo, cada hora.
#
# ESTO NO ES LA GARANTIA. Lo de "nunca mas de diez minutos" lo cumple la
# propia pantalla, que trae la hoja al abrirse si hace falta. Aqui no se
# promete la hora: GitHub trata las tareas programadas como "cuando
# pueda" y con intervalos cortos se retrasa media hora sin avisar. Se
# probo con */10 y en 33 minutos no disparo ni una vez.
#
# Entonces, para que sirve: para que quien abra la pagina despues de un
# fin de semana se la encuentre ya cargada en vez de esperar trece
# segundos. Una hora es un intervalo que GitHub si suele respetar, y
# llegar tarde aqui no le cuesta nada a nadie.
#
# Si el repositorio pasa sesenta dias sin commits, GitHub la desactiva
# sola. Tampoco pasa nada: la pantalla sigue trayendola.
#
# La corrida no descarga nada si la hoja no se ha tocado: primero
# pregunta la fecha de modificacion, que es un dato suelto.

name: Sincronizar la hoja

on:
  schedule:
    - cron: "0 * * * *"
  # Para poder dispararla a mano desde la pestana Actions.
  workflow_dispatch:

# Si una corrida se solapa con la anterior, se descarta la nueva: dos a
# la vez escribirian las mismas filas y no adelantarian nada.
concurrency:
  group: sincronizar-hoja
  cancel-in-progress: false

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pedirle a la pagina que traiga la hoja
        run: |
          respuesta=$(mktemp)
          codigo=$(curl -sS --max-time 300 \
            -o "$respuesta" -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.URL_PUBLICA || 'https://control-de-campo.vercel.app' }}/api/sincronizar")

          echo "HTTP $codigo"
          cat "$respuesta"
          echo

          if [ "$codigo" != "200" ]; then
            echo "::error::La sincronizacion respondio $codigo"
            exit 1
          fi
